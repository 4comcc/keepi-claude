name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.egyptweb --project-name quick_keep --platforms=android,ios .

      - name: Patch AndroidManifest
        run: python3 tool/patch_android.py

      - name: Add native save-text activity
        run: |
          d=android/app/src/main/kotlin/com/egyptweb/quick_keep
          mkdir -p "$d"
          cp tool/*.kt "$d/"
          ls "$d"
          mkdir -p android/app/src/main/res
          cp -r tool/res/. android/app/src/main/res/
          ls -R android/app/src/main/res | grep -E "keepi|shortcuts"

      - name: Fixed signing key
        run: python3 tool/patch_signing.py

      - name: Raise minSdk to 23 and compileSdk to 37
        run: |
          f=$(ls android/app/build.gradle* | head -1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/' "$f"
          grep -nE "minSdk|compileSdk" "$f"
          grep -n "signingConfig" "$f"

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Stamp build number
        run: sed -i "s/const kBuildLabel = 'dev';/const kBuildLabel = 'v${{ github.run_number }}';/" lib/main.dart

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Inspect packaged manifest
        run: |
          AAPT2=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/aapt2 | tail -1)
          $AAPT2 dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk \
            | grep -nE "SaveTextActivity|QuickShareAlias|PROCESS_TEXT|android.intent.action.SEND|label|versionName" || true

      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: quick-keep-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quick-keep-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish release (direct APK link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Keepi.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Keepi.apk \
            --title "Keepi v${{ github.run_number }}" \
            --notes "Build #${{ github.run_number }}" \
            --target ${{ github.sha }}

  verify:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quick-keep-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on emulator and inspect
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/verify_install.sh app-release.apk
