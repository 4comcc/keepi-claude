name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.egyptweb --project-name quick_keep --platforms=android,ios .

      - name: Patch AndroidManifest
        run: python3 tool/patch_android.py

      - name: Raise minSdk to 23
        run: |
          f=$(ls android/app/build.gradle* | head -1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          grep -n "minSdk" "$f"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: quick-keep-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quick-keep-aab
          path: build/app/outputs/bundle/release/app-release.aab
